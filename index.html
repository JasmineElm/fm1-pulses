<!doctype html>
<html lang="en" data-theme="purple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12101a">
<title>FM-1 Pulses — sequence generator</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<header>
  <h1>FM-1 <span>Pulses</span> <small>sequence generator</small></h1>
  <div class="midi">
    <select id="device"><option>— no MIDI —</option></select>
    <span id="status" class="status">loading…</span>
  </div>
</header>

<main>
  <div id="controls"></div>

  <section class="buffer">
    <h2>Phrase <small id="bufinfo"></small></h2>
    <div id="steps" class="steps"></div>
  </section>
</main>

<footer>
  <div class="group">
    <button id="gen" class="primary">Generate ⟳</button>
    <button id="rand">Randomize</button>
    <button id="audition">Audition</button>
  </div>
  <div class="group">
    <label class="themepick">Theme <select id="theme"></select></label>
    <label class="slotpick">Slot <select id="slot"></select></label>
    <button id="freeze" class="primary">Freeze → FM-1</button>
    <button id="fill">Fill all 16</button>
  </div>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
